spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/betacom}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:betacom}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:betacom}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment-123456}
security.jwt.expiration=${JWT_EXPIRATION:PT1H}
security.rate-limit.login.capacity=${LOGIN_RATE_LIMIT_CAPACITY:5}
security.rate-limit.login.window=${LOGIN_RATE_LIMIT_WINDOW:PT1M}
