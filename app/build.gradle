plugins {
    alias(libs.plugins.spring.boot)
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

dependencies {
    implementation platform(libs.spring.boot.bom)
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.validation
    implementation project(':core:security')
    implementation project(':domain')
    runtimeOnly libs.mysql
    implementation libs.mapstruct
    implementation project(':core:database')

    annotationProcessor libs.mapstruct.processor
    testImplementation(libs.spring.boot.starter.test)
    testImplementation(libs.spring.boot.testcontainers)
    testImplementation(libs.testcontainers.junit.jupiter)
    testImplementation(libs.testcontainers.mysql)
    testImplementation(libs.rest.assured)
    testRuntimeOnly(libs.junit.platform.launcher)
}

springBoot {
    mainClass = 'com.ravcube.betacom.BetacomApplication'
}

apply from: rootProject.file('gradle/podman-testcontainers.gradle')

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs API integration tests against services started by Testcontainers.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching '*EndpointTest'
    }
}
