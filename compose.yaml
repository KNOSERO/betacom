services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/betacom
      SPRING_DATASOURCE_USERNAME: betacom
      SPRING_DATASOURCE_PASSWORD: betacom
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: betacom
      MYSQL_USER: betacom
      MYSQL_PASSWORD: betacom
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "betacom", "--password=betacom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: {}
