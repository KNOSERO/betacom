services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${COMPOSE_SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/betacom}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-betacom}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-betacom}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment-123456}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      LOGIN_RATE_LIMIT_CAPACITY: ${LOGIN_RATE_LIMIT_CAPACITY:-5}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-PT1M}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-betacom}
      MYSQL_USER: ${MYSQL_USER:-betacom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-betacom}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: {}
